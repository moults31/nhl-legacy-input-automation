[package]
name = "nhl-input"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nhl-input"
path = "src/main.rs"

[dependencies]
nhl-controller = { path = "../controller" }
nhl-observer = { path = "../observer" }
nhl-script = { path = "../script" }
anyhow = "1"
ctrlc = "3"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcap = "0.9"
chrono = "0.4.45"

[features]
default = ["ocr-models"]
ocr-models = ["nhl-observer/ocr-models", "nhl-script/ocr-models"]
