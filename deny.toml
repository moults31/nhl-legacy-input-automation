# cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/ for reference

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
db-path = "~/.cargo/advisory-db"

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "NCSA",
    "Apache-2.0 WITH LLVM-exception",
]
